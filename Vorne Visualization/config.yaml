# Devices and channels to sync. Credentials, when a database target exists,
# go in .env - never here.

cache_path: cache/xl_cache.db

sync:
  window_days: 7          # trailing production days re-pulled every run
  page_size: 1000         # records per request during backfill
  max_delete_fraction: 0.2

# Line-page chart thresholds: the one place to set them. Deliberately FIXED
# values, never derived from the data: a line that moved with each period
# would let the same stop reason change zone between periods, and nobody
# would trust the chart.
charts:
  # Stop-reason quadrant, "frequent" vs "rare": more than this many stops of
  # a reason per production day (with records) in the selected period.
  frequent_stops_per_production_day: 1
  # Stop-reason quadrant, "long" vs "short": mean minutes per stop. 30 is
  # roughly where a stop stops being something an operator clears and needs
  # a callout. To be confirmed with the floor's actual callout threshold.
  long_stop_minutes: 30
  # Implausible durations: a single planned or unplanned stop is flagged when
  # it runs longer than implausible_cap_hours of net time, or longer than
  # implausible_floor_hours AND more than implausible_times_median times that
  # state's median on that line. Catches a parked line left in "maintenance"
  # (AreaB, July 2026: one 260 h event) or a "down" left open over a weekend.
  implausible_cap_hours: 24
  implausible_floor_hours: 12
  implausible_times_median: 10
  # Run/stop rhythm: mark the week the mean run burst stepped to a new level,
  # only if the step is at least this large (0.25 = 25%) and stands this many
  # standard errors clear of the week-to-week noise. AreaB, May 2026: -60%, t 6.5.
  rhythm_change_min_shift: 0.25
  rhythm_change_min_t: 3
  # Product pages, ideal cycle time: runs within this fraction of a level's
  # median belong to it; a run further off that the next run confirms starts
  # a new level (a reconfiguration). On an unchanged configuration runs agree
  # within 2% (FR8 ESTRADIOL, 88 runs). AreaB OTRIVIN, 19 Jun 2026: -4%.
  ict_change_tolerance: 0.03

# Channels per BRIEF section 3. `instant` is deprecated - do not add it.
channels: [shift_hour, shift, process_state, part, job, quality_event]

# The live writer (/live): each device's real-time data into current_state.
# Each device is read on its own every interval_seconds; a read that takes
# longer than timeout_seconds fails and is shown as failed. The page re-reads
# the table every poll_seconds. A panel is marked stale once its reading is
# older than stale_after_seconds (default four intervals: 5 s writer and 5 s
# poll jitter never trips it), so a stopped writer, an unreachable device or a
# page that can no longer reach the server cannot pass for live.
live:
  interval_seconds: 5
  timeout_seconds: 3
  poll_seconds: 5
  stale_after_seconds: 20
  # Warning tiers for a line in an unplanned stop (Down), by minutes in that state. The signal that
  # matters is a NEW stop, not being stopped: a line down for days is red but still, so a pulse means
  # something. Tune these after watching the screen for a week.
  #   under new_stop_minutes                   red band, slow pulse
  #   new_stop_minutes to extended_stop_minutes solid red, warning marker
  #   over extended_stop_minutes               solid red, marked "extended"
  # Planned stops (changeover, maintenance, setup) stay amber and never pulse; not scheduled stays grey.
  new_stop_minutes: 15
  extended_stop_minutes: 60

devices:
  - {id: FR8,   host: 10.15.22.19}
  - {id: AreaB, host: 10.15.22.83}
  - {id: AreaD, host: 10.15.22.95}
  - {id: AreaE, host: 10.15.22.119}

# Configuration epochs, assigned to each row by its own start_time. These
# mirror the seed rows at the end of schema.sql; once Postgres exists, its
# device_config_epoch table is the source of truth.
#
# Epoch 1 on every device is the era before its clock was on Eastern time
# (found from the UTC offsets in shift_hour history). Its rows are kept but
# excluded by default from anything aggregating by shift or production day.
epochs:
  FR8:
    - {epoch: 1, from: "-infinity", usable: false,
       exclusion_reason: "Before 2026-02-23 the device clock was on Central time (-06:00): shift and production-day boundaries are an hour off on a Toronto clock."}
    - {epoch: 2, from: "2026-02-23T14:00:00+00:00", note: "clock moved from Central to Eastern"}
  AreaB:
    - {epoch: 1, from: "-infinity", usable: false,
       exclusion_reason: "First hours after installation were recorded on -05:00 before the clock was set to Eastern."}
    - {epoch: 2, from: "2026-03-25T17:38:06.684485+00:00", note: "clock set to Eastern"}
  AreaD:
    - {epoch: 1, from: "-infinity", usable: false,
       exclusion_reason: "First hours after installation were recorded on -05:00 before the clock was set to Eastern."}
    - {epoch: 2, from: "2026-03-26T18:00:00+00:00", note: "clock set to Eastern"}
  AreaE:
    - {epoch: 1, from: "-infinity", usable: false,
       exclusion_reason: "First hours after installation were recorded on -05:00 before the clock was set to Eastern."}
    - {epoch: 2, from: "2026-04-01T17:00:00+00:00", note: "clock set to Eastern"}
